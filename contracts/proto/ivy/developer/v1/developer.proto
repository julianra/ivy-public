syntax = "proto3";

package ivy.developer.v1;

// Public, developer-facing envelope for examples and tooling. This is not the
// private Ivy Core wire protocol.
message CapabilityDeclaration {
  string id = 1;
  uint32 version = 2;
  string schema = 3;
  CapabilityKind kind = 4;
  RetrySemantics retry_semantics = 5;
  bool externally_invocable = 6;
}

enum CapabilityKind {
  CAPABILITY_KIND_UNSPECIFIED = 0;
  CAPABILITY_KIND_QUERY = 1;
  CAPABILITY_KIND_COMMAND = 2;
}

enum RetrySemantics {
  RETRY_SEMANTICS_UNSPECIFIED = 0;
  RETRY_SEMANTICS_RESULT_REPLAY = 1;
  RETRY_SEMANTICS_EXTERNAL_EFFECT_MAY_REPEAT = 2;
  RETRY_SEMANTICS_NOT_RETRYABLE = 3;
}

message DevelopmentInvocation {
  string consumer_id = 1;
  string capability_id = 2;
  bytes payload = 3;
}

message DevelopmentResult {
  oneof outcome {
    bytes payload = 1;
    DevelopmentError error = 2;
  }
}

message DevelopmentError {
  string code = 1;
  string message = 2;
}
