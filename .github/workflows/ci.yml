name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify DCO 1.1 sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dco.py "$BASE_SHA" "$HEAD_SHA"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p ivy-cli -- validate examples/hello-clock/module.yaml
      - name: Verify generated manifest
        run: |
          ivy_generator_tmp="$(mktemp -d)"
          cargo run -p ivy-cli -- new "$ivy_generator_tmp/generated" --id generated-clock --namespace community.generated.clock
          cargo run -p ivy-cli -- validate "$ivy_generator_tmp/generated/module.yaml"
      - run: cargo run -p ivy-hello-clock
      - run: cargo run -p ivy-widget-preview -- examples/hello-clock/widget.json --output /tmp/widget-preview.html

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_docs.py

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/dart/ivy_developer_contracts
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart run test/contracts_test.dart

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject private paths and key material
        run: ./scripts/repository-safety.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
