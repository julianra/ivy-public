name: Dependency review

on: pull_request

permissions:
  contents: read

jobs:
  dependency-review:
    # Dependency Review for this private personal repository requires an
    # unavailable plan feature. Activate it after an approved public launch.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
