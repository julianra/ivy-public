name: Developer Kit bug
description: Report a reproducible problem in public Developer Kit code.
title: "[Bug]: "
labels: ["type:bug", "status:needs-repro"]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or private Ivy information here.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit or release version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal commands and inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety
      options:
        - label: This report contains no secrets, personal data or private Ivy source.
          required: true
