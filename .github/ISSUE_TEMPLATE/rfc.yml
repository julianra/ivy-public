name: RFC proposal / RFC-voorstel
description: Propose a contract or compatibility change. / Stel een contract- of compatibiliteitswijziging voor.
title: "[RFC]: "
labels: ["type:rfc"]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem and evidence / Probleem en bewijs}
    validations: {required: true}
  - type: textarea
    id: boundary
    attributes: {label: Authority and trust boundary / Bevoegdheids- en trustgrens}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed contract / Voorgesteld contract}
    validations: {required: true}
  - type: textarea
    id: failures
    attributes: {label: Failure, retry, rollback and compatibility / Falen, retry, rollback en compatibiliteit}
    validations: {required: true}
