name: Module proposal / Modulevoorstel
description: Propose an external or reference module. / Stel een externe of referentiemodule voor.
title: "[Module]: "
labels: ["area:modules"]
body:
  - type: input
    id: domain
    attributes:
      label: Capability domain / Capabilitydomein
      placeholder: community.example.domain
    validations: {required: true}
  - type: textarea
    id: responsibility
    attributes:
      label: Responsibility and exclusions / Verantwoordelijkheid en uitsluitingen
    validations: {required: true}
  - type: textarea
    id: capabilities
    attributes:
      label: Capabilities and consumers / Capabilities en consumers
    validations: {required: true}
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution / Distributie
      options: [Open source, Closed source / Gesloten bron, Paid / Betaald, Free / Gratis, Undecided / Onbeslist]
    validations: {required: true}
