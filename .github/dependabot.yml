version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Keep version-update PRs disabled during private launch preparation.
    # Vulnerability alerts and automated security fixes remain enabled.
    open-pull-requests-limit: 0
  - package-ecosystem: pub
    directory: /sdk/dart/ivy_developer_contracts
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
